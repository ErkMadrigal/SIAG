# Deploy del panel (Vue) sin conexiones entrantes al hosting:
# al hacer push a master compila y publica el resultado en la rama "dist" de este mismo repo.
# Un cron en el cPanel de arma2 descarga esa rama y la copia a public_html/SIAG (sin tocar descarga/).
name: Build panel (rama dist)

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publicar dist en la rama dist
        run: |
          rm -rf dist/descarga
          touch dist/.nojekyll
          cd dist
          git init -q -b dist
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
